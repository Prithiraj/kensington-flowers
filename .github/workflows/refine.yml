name: Refine source after browser review
on:
  push:
    paths: ['.github/workflows/refine.yml']
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct source markup and stabilize visual review
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          p=root/'scripts/build.mjs'
          s=p.read_text()
          s=s.replace("close:'<path d=\"m6 6 12 12M6 18 18-12\"/>'", "close:'<path d=\"m6 6 12 12M6 18 18 6\"/>'")
          for symbol,label in [('pin','Visit the shop'),('phone','Let’s talk flowers'),('mail','Write to us'),('clock','Opening hours')]:
              old='<div>${icon(\''+symbol+'\')}<div><dt>'+label+'</dt><dd>'
              new='<div><dt>${icon(\''+symbol+'\')}<span>'+label+'</span></dt><dd>'
              assert old in s,old
              s=s.replace(old,new,1)
          s=s.replace('</dd></div></div>', '</dd></div>')
          p.write_text(s)
          p=root/'assets/site.css'
          s=p.read_text().replace('.section-heading p{', '.section-heading>p{')
          s=s.replace('.contact-list>div{display:grid;grid-template-columns:30px 1fr;gap:15px;padding:22px 0;border-bottom:1px solid var(--line)}','.contact-list>div{position:relative;padding:22px 0 22px 45px;border-bottom:1px solid var(--line)}')
          s=s.replace('.contact-list svg{width:20px;height:20px;color:var(--garnet);margin-top:3px}', '.contact-list svg{position:absolute;left:0;top:25px;width:20px;height:20px;color:var(--garnet)}')
          s=s.replace('.contact-list>div{padding-block:17px}', '.contact-list>div{padding-block:17px}.contact-list svg{top:20px}')
          p.write_text(s)
          p=root/'scripts/check.mjs'
          s=p.read_text().replace("await page.evaluate(()=>window.scrollTo(0,0));", "await page.evaluate(()=>window.scrollTo({top:0,left:0,behavior:'instant'}));\n    await page.waitForFunction(()=>window.scrollY===0);\n    await page.waitForTimeout(100);\n    await page.mouse.move(0,0);")
          s=s.replace('fullPage:true});results.screenshots.push(name);', "fullPage:true,animations:'disabled'});results.screenshots.push(name);")
          p.write_text(s)
          p=root/'assets/photos.json'
          v=json.loads(p.read_text())
          for photo in v:
              if photo['id']=='basket': photo['alt']="Paper-wrapped pink flowers in a wicker basket; illustrative photography, not the Kensington shop."
          p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit reviewed source corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build.mjs scripts/check.mjs assets/site.css assets/photos.json
          git commit -m 'Fix contact semantics, image descriptions and stable screenshot capture [skip ci]'
          git push origin HEAD:main
